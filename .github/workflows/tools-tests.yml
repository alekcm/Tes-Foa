name: tools-tests

on:
  push:
    paths:
      - "skyrim-combat-port/tools/**"
      - "skyrim-combat-port/tests/**"
      - "skyrim-combat-port/src/**"
      - "skyrim-combat-port/native/src/**"
      - "skyrim-combat-port/docs/reference/**"
      - ".github/workflows/tools-tests.yml"
  pull_request:
    paths:
      - "skyrim-combat-port/tools/**"
      - "skyrim-combat-port/tests/**"
      - "skyrim-combat-port/src/**"

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyrim-combat-port
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Papyrus lint
        run: python tools/papyrus_lint.py src/papyrus

      - name: Docs links
        run: python tools/check_docs.py

      # Аудит: каждая функция C++ описана в CODE_AUDIT.md, каждая метка AS-n есть в реестре допущений.
      - name: Audit ledger
        run: python tools/verify_audit.py

      # API: каждый символ RE:: и каждый вызываемый метод существуют в закреплённых заголовках CommonLibSSE-NG.
      - name: API against CommonLib headers
        run: python tools/verify_api.py --clone --methods
