name: native

on:
  push:
    paths:
      - "skyrim-combat-port/native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "skyrim-combat-port/native/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build SKSE plugin
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skyrim-combat-port/native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: false

      - name: Clone CommonLibSSE-NG
        run: git clone --depth 1 -b ng https://github.com/alandtse/CommonLibVR.git lib/commonlibsse-ng

      - name: Build and report
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          xmake f -y -m release *>&1 | Tee-Object -FilePath cfg.log
          $cfgExit = $LASTEXITCODE
          xmake build -y -v *>&1 | Tee-Object -FilePath build.log
          $buildExit = $LASTEXITCODE
          $tail = (Get-Content build.log -Tail 60 -ErrorAction SilentlyContinue) -join "`n"
          "xmake f exit=$cfgExit, xmake build exit=$buildExit`n`n``````n$tail`n``````" |
            gh issue comment 1 --body-file - --repo $env:GITHUB_REPOSITORY
          if ($cfgExit -ne 0 -or $buildExit -ne 0) { exit 1 }

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: TGCombatPort-dll
          path: skyrim-combat-port/native/build/**/*.dll
          if-no-files-found: warn
