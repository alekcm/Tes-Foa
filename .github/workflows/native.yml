name: native

on:
  push:
    paths:
      - "skyrim-combat-port/native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "skyrim-combat-port/native/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build SKSE plugin
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skyrim-combat-port/native
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: false

      - name: Clone CommonLibSSE-NG
        run: git clone --depth 1 -b ng https://github.com/alandtse/CommonLibVR.git lib\commonlibsse-ng

      - name: Build
        id: build
        run: |
          xmake f -y -m release > build.log 2>&1
          if errorlevel 1 goto :report
          xmake build -y -v >> build.log 2>&1
          if errorlevel 1 goto :report
          exit /b 0
          :report
          echo build failed
          exit /b 1

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: TGCombatPort-dll
          path: skyrim-combat-port/native/build/windows/**/*.dll
          if-no-files-found: error

      - name: Report build error
        if: failure()
        shell: pwsh
        run: |
          $log = "skyrim-combat-port/native/build.log"
          if (Test-Path $log) {
            $tail = Get-Content $log -Tail 120 -Encoding utf8 | Out-String
            $body = "Сборка SKSE-плагина упала. Хвост лога:`n`n``````n" + $tail + "`n``````"
            $body | Out-File -Encoding utf8 comment.md
            gh issue comment 1 --body-file comment.md --repo $env:GITHUB_REPOSITORY
          } else {
            "build.log не появился — xmake не дошёл до вывода" | gh issue comment 1 --body-file - --repo $env:GITHUB_REPOSITORY
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
