name: native

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "skyrim-combat-port/native/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build SKSE plugin
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skyrim-combat-port/native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: false

      # Коммит CommonLibSSE-NG закреплён: у свежего 16.11.0 сломана поставка prebuilt
      # (нет extern/openvr/headers → fatal error: 'openvr.h' not found).
      - name: Clone CommonLibSSE-NG
        run: |
          git clone -q -b ng https://github.com/alandtse/CommonLibVR.git lib/commonlibsse-ng
          cd lib/commonlibsse-ng
          git checkout -q 48b17e1dea3028850adf63209f6733dbf4dcdcd7

      - name: Build
        shell: pwsh
        run: |
          xmake f -y -m release *>&1 | Tee-Object -FilePath cfg.log
          if ($LASTEXITCODE -ne 0) { throw "xmake f failed: $LASTEXITCODE" }
          xmake build -y *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "xmake build failed: $LASTEXITCODE" }

      - name: Report build error
        if: failure()
        shell: pwsh
        run: |
          # Ошибки вытаскиваем аннотациями: логи Actions лежат на blob-хосте, который из песочницы
          # агента недоступен, а annotations читаются через API.
          $found = $false
          foreach ($file in @('cfg.log', 'build.log')) {
            $log = @(Get-Content $file -ErrorAction SilentlyContinue)
            if ($log.Count -eq 0) { continue }
            $found = $true
            $errs = $log | Where-Object { $_ -match 'error|failed|fatal|cannot' } | Select-Object -Last 15
            foreach ($line in $errs) {
              $clean = ($line -replace "`r", "" -replace "`n", " ")
              Write-Output ("::error::[" + $file + "] " + $clean)
            }
            $tail = $log | Select-Object -Last 5
            foreach ($line in $tail) {
              $clean = ($line -replace "`r", "" -replace "`n", " ")
              Write-Output ("::error::[" + $file + " хвост] " + $clean)
            }
          }
          if (-not $found) {
            Write-Output "::error::логов сборки нет ни одного"
          }

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: TGCombatPort-dll
          path: skyrim-combat-port/native/build/windows/x64/release/*.dll
          if-no-files-found: error

      - name: Package for install
        shell: pwsh
        run: |
          $name = "TGCombatPort-" + ($env:GITHUB_REF_NAME -replace '[/\\]', '-') + ".zip"
          New-Item -ItemType Directory -Force -Path pkg/SKSE/Plugins/TGCombatPort | Out-Null
          Copy-Item build/windows/x64/release/TGCombatPort.dll pkg/SKSE/Plugins/
          Copy-Item rules/Rules.txt pkg/SKSE/Plugins/TGCombatPort/
          Copy-Item -Recurse assets/anim/meshes pkg/
          Write-Output "правила: $(Get-Content rules/Rules.txt | Measure-Object -Line | Select-Object -ExpandProperty Lines) строк"
          Compress-Archive -Path pkg/* -DestinationPath $name -Force
          "PKG_NAME=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Output "собран архив $name"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = @"
          SKSE-плагин TGCombatPort (часть мода). Проверка: DLL собран из ``skyrim-combat-port/native``.

          Установка: распаковать архив в папку игры (появятся ``Data\SKSE\Plugins\TGCombatPort.dll``, ``Data\SKSE\Plugins\TGCombatPort\Rules.txt`` и папка анимаций ``Data\meshes\actors\character\…\DynamicAnimationReplacer`` для укола кинжалом/мечом; анимации требуют мода Dynamic Animation Replacer)
          или установить zip через Vortex. Отдельный .dll не выкладываем: браузеры блокируют такое скачивание. Нужны SKSE64 2.3.1 (runtime 1.7.104) и Address Library v13.
          "@
          $notes | Out-File -Encoding utf8 notes.md
          # Только архив: браузеры блокируют скачивание «голых» .dll.
          gh release create $env:TAG --title "TGCombatPort $env:TAG" --notes-file notes.md `
            "$env:PKG_NAME"

