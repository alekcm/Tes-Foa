name: native

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "skyrim-combat-port/native/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build SKSE plugin
    runs-on: windows-latest
    defaults:
      run:
        working-directory: skyrim-combat-port/native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          build-cache: false

      - name: Clone CommonLibSSE-NG
        run: git clone --depth 1 -b ng https://github.com/alandtse/CommonLibVR.git lib/commonlibsse-ng

      - name: Build
        shell: pwsh
        run: |
          xmake f -y -m release *>&1 | Tee-Object -FilePath cfg.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          xmake build -y *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report build error
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @("build.log", "cfg.log") | Where-Object { Test-Path $_ }
          $tail = if ($files) { (Get-Content $files -Tail 80) -join "`n" } else { "логов нет" }
          "Сборка DLL упала. Хвост лога:`n`n```````n$tail`n```````" |
            gh issue comment 1 --body-file - --repo $env:GITHUB_REPOSITORY

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: TGCombatPort-dll
          path: skyrim-combat-port/native/build/windows/x64/release/*.dll
          if-no-files-found: error

      - name: Package for install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/SKSE/Plugins | Out-Null
          Copy-Item build/windows/x64/release/TGCombatPort.dll pkg/SKSE/Plugins/
          Compress-Archive -Path pkg/* -DestinationPath "TGCombatPort-${{ github.ref_name }}.zip" -Force

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = @"
          SKSE-плагин TGCombatPort (часть мода). Проверка: DLL собран из ``skyrim-combat-port/native``.

          Установка: распаковать архив в папку игры (появятся ``Data\SKSE\Plugins\TGCombatPort.dll``)
          или установить zip через Vortex. Нужны SKSE64 2.3.1 (runtime 1.7.104) и Address Library v13.
          "@
          $notes | Out-File -Encoding utf8 notes.md
          gh release create $env:TAG --title "TGCombatPort $env:TAG" --notes-file notes.md `
            "build/windows/x64/release/TGCombatPort.dll" `
            "TGCombatPort-$env:TAG.zip"

